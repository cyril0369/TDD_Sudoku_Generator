name: Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build-images:
    name: Build and publish images
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: api
            context: api
            dockerfile: api/Dockerfile
          - service: front
            context: front
            dockerfile: front/Dockerfile
          - service: nginx
            context: nginx
            dockerfile: nginx/Dockerfile
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/aws-docker-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/aws-docker-${{ matrix.service }}:latest

  deploy:
    name: Deploy to remote host
    runs-on: ubuntu-latest
    needs: build-images
    environment: production
    steps:
      - name: Deploy with SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          GHCR_USERNAME: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_NAMESPACE: ghcr.io/${{ github.repository_owner }}
          IMAGE_TAG: ${{ github.sha }}
          DEPLOY_PATH: ${{ secrets.SSH_TARGET_DIR }}
          REPOSITORY: ${{ github.repository }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: GHCR_USERNAME,GHCR_TOKEN,GHCR_NAMESPACE,IMAGE_TAG,DEPLOY_PATH,REPOSITORY
          script: |
            set -euo pipefail
            mkdir -p "${DEPLOY_PATH}"
            cd "${DEPLOY_PATH}"

            if [ ! -d .git ]; then
              git clone --depth 1 "https://github.com/${REPOSITORY}.git" .
            else
              git fetch --depth 1 origin main
              git checkout main
              git reset --hard origin/main
            fi

            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin
            export GHCR_NAMESPACE IMAGE_TAG
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
